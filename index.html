<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業級個人財務與退休規劃系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 p-3 md:p-6 text-slate-800">
  <div class="max-w-5xl mx-auto bg-white p-5 md:p-8 rounded-2xl shadow-xl border border-slate-200">
    <div class="border-b pb-4 mb-6">
      <h1 class="text-2xl md:text-3xl font-extrabold text-indigo-950">專業級個人財務與退休試算系統</h1>
      <p class="text-slate-500 text-sm mt-1">整合動態收支、房車貸償還與退休資產轉化模型</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左側：輸入控制面板 -->
      <div class="lg:col-span-1 space-y-5 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs md:text-sm">
        
        <!-- 個人背景 -->
        <div>
          <h3 class="font-bold text-indigo-900 mb-2 border-b pb-1">1. 基本背景與年齡</h3>
          <div class="space-y-2">
            <div>
              <label class="block font-medium">目前的年齡：<span id="currentAgeVal" class="font-bold text-indigo-600">30</span> 歲</label>
              <input type="range" id="currentAge" min="18" max="60" value="30" class="w-full">
            </div>
            <div>
              <label class="block font-medium">預計退休年齡：<span id="retireAgeVal" class="font-bold text-indigo-600">60</span> 歲</label>
              <input type="range" id="retireAge" min="45" max="75" value="60" class="w-full">
            </div>
          </div>
        </div>

        <!-- 收入與生活費 -->
        <div>
          <h3 class="font-bold text-indigo-900 mb-2 border-b pb-1">2. 收入與基本開銷</h3>
          <div class="space-y-2">
            <div>
              <label class="block font-medium">每月工作薪水 (NT$)：</label>
              <input type="number" id="salary" value="50000" step="5000" class="w-full p-1 border rounded">
            </div>
            <div>
              <label class="block font-medium">每月基本生活開銷 (NT$)：</label>
              <input type="number" id="expenses" value="15000" step="1000" class="w-full p-1 border rounded">
            </div>
          </div>
        </div>

        <!-- 負債設定 -->
        <div>
          <h3 class="font-bold text-indigo-900 mb-2 border-b pb-1">3. 貸款與負債 (月負擔)</h3>
          <div class="space-y-2">
            <div>
              <label class="block font-medium">房貸每月本息 (NT$)：</label>
              <input type="number" id="mortgagePmt" value="24000" step="1000" class="w-full p-1 border rounded">
            </div>
            <div>
              <label class="block font-medium">房貸剩餘年限：<span id="mortgageYearsVal" class="font-bold text-indigo-600">25</span> 年</label>
              <input type="range" id="mortgageYears" min="0" max="30" value="25" class="w-full">
            </div>
            <div>
              <label class="block font-medium">車貸每月本息 (NT$)：</label>
              <input type="number" id="carLoanPmt" value="0" step="1000" class="w-full p-1 border rounded">
            </div>
          </div>
        </div>

        <!-- 投資與退休設定 -->
        <div>
          <h3 class="font-bold text-indigo-900 mb-2 border-b pb-1">4. 投資與退休殖利率</h3>
          <div class="space-y-2">
            <div>
              <label class="block font-medium">目前已有投資本金 (NT$)：</label>
              <input type="number" id="initialCapital" value="300000" step="50000" class="w-full p-1 border rounded">
            </div>
            <div>
              <label class="block font-medium">投資年化報酬率：<span id="investRateVal" class="font-bold text-indigo-600">8%</span></label>
              <input type="range" id="investRate" min="3" max="15" step="0.5" value="8" class="w-full">
            </div>
            <div>
              <label class="block font-medium">退休轉化殖利率：<span id="retireYieldVal" class="font-bold text-indigo-600">5%</span></label>
              <input type="range" id="retireYield" min="3" max="10" step="0.5" value="5" class="w-full">
            </div>
          </div>
        </div>

      </div>

      <!-- 右側：數據儀表板與圖表 -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- 核心 KPI 數據 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
          <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-xl">
            <div class="text-xs text-indigo-600 font-semibold">每月可用投資金流</div>
            <div id="investableCash" class="text-lg font-black text-indigo-900">NT$ 0</div>
          </div>
          <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl">
            <div class="text-xs text-blue-600 font-semibold">退休時預估總資產</div>
            <div id="retireTotalAsset" class="text-lg font-black text-blue-900">NT$ 0</div>
          </div>
          <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
            <div class="text-xs text-emerald-600 font-semibold">退休預估月領配息</div>
            <div id="retireMonthlyCash" class="text-lg font-black text-emerald-800">NT$ 0</div>
          </div>
        </div>

        <!-- 視覺圖表 -->
        <div class="bg-white p-4 border rounded-xl shadow-sm">
          <h4 class="text-xs font-bold text-slate-500 mb-2">資產累積成長趨勢圖 (含貸款繳清後金流釋出效果)</h4>
          <div class="relative h-80 w-full">
            <canvas id="proChart"></canvas>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('proChart').getContext('2d');
    let proChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: '總資產累積 (NT$)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.2 }] },
      options: { responsive: true, maintainAspectRatio: false }
    });

    function calculate() {
      const curAge = parseInt(document.getElementById('currentAge').value);
      const retAge = parseInt(document.getElementById('retireAge').value);
      const salary = parseFloat(document.getElementById('salary').value) || 0;
      const expenses = parseFloat(document.getElementById('expenses').value) || 0;
      const mortgagePmt = parseFloat(document.getElementById('mortgagePmt').value) || 0;
      const mortgageYears = parseInt(document.getElementById('mortgageYears').value);
      const carLoanPmt = parseFloat(document.getElementById('carLoanPmt').value) || 0;
      const initialCapital = parseFloat(document.getElementById('initialCapital').value) || 0;
      const investRate = parseFloat(document.getElementById('investRate').value) / 100 / 12;
      const retireYield = parseFloat(document.getElementById('retireYield').value) / 100;

      document.getElementById('currentAgeVal').innerText = curAge;
      document.getElementById('retireAgeVal').innerText = retAge;
      document.getElementById('mortgageYearsVal').innerText = mortgageYears;
      document.getElementById('investRateVal').innerText = (investRate * 12 * 100).toFixed(1) + '%';
      document.getElementById('retireYieldVal').innerText = (retireYield * 100).toFixed(1) + '%';

      // 初期月投資能力
      const initialInvestable = salary - expenses - mortgagePmt - carLoanPmt;
      document.getElementById('investableCash').innerText = 'NT$ ' + (initialInvestable > 0 ? initialInvestable.toLocaleString() : '0 (金流不足)');

      let labels = [], data = [];
      let currentVal = initialCapital;
      const totalYears = retAge - curAge;

      for (let y = 0; y <= totalYears; y++) {
        labels.push((curAge + y) + '歲');
        if (y === 0) {
          data.push(initialCapital);
        } else {
          // 動態判斷貸款是否還清
          let activeMortgage = (y <= mortgageYears) ? mortgagePmt : 0;
          let monthlyInvest = salary - expenses - activeMortgage - carLoanPmt;
          if (monthlyInvest < 0) monthlyInvest = 0;

          for (let m = 0; m < 12; m++) {
            currentVal = currentVal * (1 + investRate) + monthlyInvest;
          }
          data.push(Math.round(currentVal));
        }
      }

      const finalAsset = data[data.length - 1] || 0;
      const monthlyCash = Math.round((finalAsset * retireYield) / 12);

      document.getElementById('retireTotalAsset').innerText = 'NT$ ' + finalAsset.toLocaleString();
      document.getElementById('retireMonthlyCash').innerText = 'NT$ ' + monthlyCash.toLocaleString();

      proChart.data.labels = labels;
      proChart.data.datasets[0].data = data;
      proChart.update();
    }

    document.querySelectorAll('input').forEach(input => input.addEventListener('input', calculate));
    calculate();
  </script>
</body>
</html>
